app_version: 1.0

short_description: IR TV sleep timer with countdown and auto power-off

description: |
  Set a countdown timer (in minutes), and this app will automatically send
  an IR power-off signal to your TV when the timer reaches zero. Includes
  a live countdown display, add/subtract minutes controls, and a
  configurable IR code (NEC protocol) via `config.json` for different TV
  brands/models. Ships pre-configured with a working LG TV power-off code.

installation_instructions: |
  Copy the `TVSleepTimer` folder into your `/apps` folder.

devices:
- Cardputer
